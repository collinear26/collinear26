<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCOT RecordsHub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("488116812_2472210126505231_2397120033774347188_n.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            text-align: center;
        }

        /* Dark Forest Green Background Overlay (Kapareho ng sa Login/Registration Card) */
        body::before {
            content: "";
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 30, 18, 0.78);
            z-index: -1;
        }

        /* Wrapper Container para sa lahat ng Content */
        .landing-container {
            max-width: 900px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Logo Area */
        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            width: 140px; /* Eksaktong laki para sa landing page screen */
            height: auto;
        }

        /* Subtitle sa itaas ng malaking text */
        .top-subtitle {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        /* Malaki at Bold na Main Title */
        h1 {
            color: #ffffff;
            font-size: 80px;
            font-weight: 1000;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        /* Deskripsyon sa ilalim ng Title */
        .description {
            color: rgba(255, 255, 255, 0.85);
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 35px;
            letter-spacing: 0.2px;
        }

        /* Log In Button Styling */
        .login-link {
            text-decoration: none;
            display: inline-block;
            margin-bottom: 25px;
        }

        .login-btn {
            width: 180px;
            height: 48px;
            background: #ffffff;
            color: #0c1e12;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Responsive adjustments para sa mga mobile phones */
        @media (max-width: 768px) {
            h1 {
                font-size: 42px;
            }
            .description {
                font-size: 15px;
            }
            .top-subtitle {
                font-size: 13px;
            }
            .logo-container img {
                width: 110px;
            }
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <div class="logo-container">
            <img src="ascot seal.png" alt="ASCOT Seal">
        </div>

        <div class="top-subtitle">Records Management Unit</div>
        <h1>ASCOT RecordsHub</h1>
        <div class="description">A Web-Based Records Management and Document Tracking System</div>

        <a href="login.php" class="login-link">
            <button class="login-btn">Log In</button>
        </a>
    </div>

</body>
</html>
